<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESP32 Nav Bridge</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:16px; font:16px/1.5 -apple-system,sans-serif;
         background:#111; color:#eee; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#888; font-size:12px; margin:0 0 12px; }
  input, button { font-size:16px; padding:10px; border-radius:8px;
         border:1px solid #444; background:#1c1c1c; color:#eee; box-sizing:border-box; }
  input { width:100%; margin-bottom:8px; }
  button { width:100%; margin-bottom:8px; background:#2a5db0; border-color:#2a5db0; }
  button:disabled { opacity:.4; }
  button.sec { background:#1c1c1c; border-color:#444; }
  #log { font:12px/1.4 ui-monospace,monospace; background:#000; color:#6f6;
         padding:8px; border-radius:8px; height:130px; overflow:auto; white-space:pre-wrap; }
  #hud { background:#000; border-radius:12px; padding:16px; text-align:center; margin:12px 0; }
  #arrow { font-size:64px; line-height:1; }
  #dist  { font-size:40px; font-weight:700; }
  #road  { color:#6cf; }
  #eta   { color:#888; font-size:14px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  details { margin:8px 0; }
  summary { color:#888; font-size:14px; }
  small { color:#888; }
  footer { color:#666; font-size:11px; margin-top:16px; }
  a { color:#6cf; }
</style>

<h1>ESP32 Nav Bridge</h1>
<p class="sub">OSRM + Nominatim（APIキー不要）</p>

<input id="dest" placeholder="目的地（例: 名古屋駅）">

<div class="row">
  <button id="btnBle">1. ESP32に接続</button>
  <button id="btnGo" disabled>2. ナビ開始</button>
</div>
<div class="row">
  <button id="btnStop" class="sec" disabled>停止</button>
  <button id="btnTest" class="sec">テスト送信</button>
</div>

<div id="hud">
  <div id="arrow">–</div>
  <div id="dist">--</div>
  <div id="road">&nbsp;</div>
  <div id="eta">&nbsp;</div>
</div>

<div id="log"></div>

<details>
  <summary>詳細設定</summary>
  <p><small>経路サーバ（OSRM互換）。自前で立てた場合はここを書き換えます。</small></p>
  <input id="osrm" placeholder="https://router.project-osrm.org">
</details>

<p><small>Bluefy で HTTPS 配信されたこのページを開いてください。file:// では動きません。</small></p>
<footer>
  経路・地名データ © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>（ODbL）。
  経路探索は <a href="http://project-osrm.org/">OSRM</a> の公開サーバ、地名検索は
  <a href="https://nominatim.org/">Nominatim</a> を利用しています。いずれも公共の無償サービスのため、
  連続した大量アクセスは行わないでください。
</footer>

<script>
const SVC = '7a0b1000-5f3e-4c2a-9d71-8e6f0a1b2c3d';
const CHR = '7a0b1001-5f3e-4c2a-9d71-8e6f0a1b2c3d';

const OSRM_DEFAULT = 'https://router.project-osrm.org';
const NOMINATIM    = 'https://nominatim.openstreetmap.org/search';

const T = { STRAIGHT:0, SLIGHT_R:1, RIGHT:2, SHARP_R:3, UTURN:4,
            SHARP_L:5, LEFT:6, SLIGHT_L:7, ARRIVE:8, DEPART:9, ROUNDABOUT:10 };
const GLYPH = ['↑','↗','→','↘','↓','↙','←','↖','🏁','▲','◎'];

const $ = id => document.getElementById(id);
const log = m => { const l = $('log'); l.textContent += m + '\n'; l.scrollTop = 1e9; };

/* ---------- BLE ---------- */
let chr = null, dev = null, busy = false;

async function bleConnect() {
  dev = await navigator.bluetooth.requestDevice({ filters:[{ services:[SVC] }] });
  dev.addEventListener('gattserverdisconnected', () => { chr = null; log('BLE 切断'); });
  const svc = await (await dev.gatt.connect()).getPrimaryService(SVC);
  chr = await svc.getCharacteristic(CHR);
  log('BLE 接続: ' + (dev.name || dev.id));
}

function utf8Trunc(s, max) {
  const b = new TextEncoder().encode(s);
  if (b.length <= max) return b;
  let n = max;
  while (n > 0 && (b[n] & 0xC0) === 0x80) n--;   // 多バイト文字の途中で切らない
  return b.slice(0, n);
}

async function send(turn, dist, eta, road) {
  if (!chr || busy) return;
  busy = true;
  try {
    const nb  = utf8Trunc(road || '', 26);
    const buf = new Uint8Array(5 + nb.length);
    const dv  = new DataView(buf.buffer);
    dv.setUint8(0, turn);
    dv.setUint16(1, Math.min(65535, Math.round(dist)), true);
    dv.setUint16(3, Math.min(65535, Math.round(eta)),  true);
    buf.set(nb, 5);
    if (chr.properties && chr.properties.writeWithoutResponse)
      await chr.writeValueWithoutResponse(buf);
    else
      await chr.writeValue(buf);
  } catch (e) { log('送信失敗: ' + e.message); }
  busy = false;
}

/* ---------- 幾何 ---------- */
const R = 6371000;
const rad = d => d * Math.PI / 180;
function hav(a, b) {                     // a,b = [lon,lat]
  const dLat = rad(b[1] - a[1]), dLon = rad(b[0] - a[0]);
  const s = Math.sin(dLat / 2) ** 2 +
            Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// OSRM の maneuver は Mapbox Directions と同じ語彙
function turnCode(m) {
  if (m.type === 'arrive') return T.ARRIVE;
  if (m.type === 'depart') return T.DEPART;
  if (m.type === 'rotary' || m.type.startsWith('roundabout')) return T.ROUNDABOUT;
  return ({ 'sharp right':T.SHARP_R, 'right':T.RIGHT, 'slight right':T.SLIGHT_R,
            'straight':T.STRAIGHT, 'uturn':T.UTURN,
            'slight left':T.SLIGHT_L, 'left':T.LEFT, 'sharp left':T.SHARP_L
          })[m.modifier] ?? T.STRAIGHT;
}

/* ---------- 経路 ---------- */
let steps = [], coords = [], idx = 0, minD = Infinity;
let watchId = null, lastReroute = 0, wakeLock = null, dest = null;

const osrmBase = () => ($('osrm').value.trim() || OSRM_DEFAULT).replace(/\/+$/, '');

// Nominatim は「1秒に1リクエストまで」の利用規約。出発時の1回だけ呼ぶ
async function geocode(q) {
  const u = NOMINATIM + '?q=' + encodeURIComponent(q)
          + '&format=jsonv2&limit=1&countrycodes=jp&accept-language=ja';
  const r = await fetch(u, { headers: { 'Accept': 'application/json' } });
  if (!r.ok) throw new Error('地名検索に失敗 (' + r.status + ')');
  const j = await r.json();
  if (!j.length) throw new Error('目的地が見つかりません');
  log('目的地: ' + j[0].display_name.split(',').slice(0, 3).join(','));
  return [parseFloat(j[0].lon), parseFloat(j[0].lat)];
}

async function route(from, to) {
  const u = osrmBase() + '/route/v1/driving/'
          + from[0] + ',' + from[1] + ';' + to[0] + ',' + to[1]
          + '?steps=true&geometries=geojson&overview=full&annotations=false';
  const r = await fetch(u);
  if (!r.ok) throw new Error('経路サーバ応答エラー (' + r.status + ')');
  const j = await r.json();
  if (j.code !== 'Ok' || !j.routes || !j.routes.length)
    throw new Error('経路が引けません (' + (j.code || '?') + ')');

  const rt = j.routes[0];
  steps  = rt.legs[0].steps;
  coords = rt.geometry.coordinates;
  idx    = 0;
  minD   = Infinity;
  log('経路取得: ' + (rt.distance / 1000).toFixed(1) + 'km / '
      + Math.round(rt.duration / 60) + '分 / ' + steps.length + 'ステップ');
}

function offRoute(pos) {
  let min = Infinity;
  for (const c of coords) { const d = hav(pos, c); if (d < min) min = d; }
  return min > 80;
}

// 区間を進める。「25m以内に入った」だけでなく
// 「一度50m以内に近づいてから30m以上遠ざかった＝通過した」でも次へ送る
function advance(pos) {
  while (idx + 1 < steps.length - 1) {
    const d = hav(pos, steps[idx + 1].maneuver.location);
    if (d < minD) minD = d;
    if (d < 25 || (minD < 50 && d > minD + 30)) { idx++; minD = Infinity; }
    else break;
  }
}

// 日本の細い道は OSM に名前が無いことが多い。その場合は路線番号を出す
function roadLabel(step) {
  if (step.name) return step.name;
  if (step.ref)  return 'R' + step.ref.split(';')[0].trim();
  return '';
}

function hud(turn, dist, eta, road) {
  $('arrow').textContent = GLYPH[turn] ?? '–';
  $('dist').textContent  = dist >= 1000 ? (dist / 1000).toFixed(1) + 'km' : Math.round(dist) + 'm';
  $('road').textContent  = road || ' ';
  $('eta').textContent   = eta + ' 分';
}

function onFix(p) {
  if (!steps.length) return;
  const pos = [p.coords.longitude, p.coords.latitude];

  if (offRoute(pos) && Date.now() - lastReroute > 20000) {
    lastReroute = Date.now();
    log('ルート外 → 再探索');
    route(pos, dest).catch(e => log(e.message));
    return;
  }

  advance(pos);

  const nxt  = steps[Math.min(idx + 1, steps.length - 1)];
  const dist = hav(pos, nxt.maneuver.location);
  let sec = 0;
  for (let i = idx; i < steps.length; i++) sec += steps[i].duration;
  const eta  = Math.max(0, Math.round(sec / 60));
  const code = turnCode(nxt.maneuver);
  const road = roadLabel(nxt);

  hud(code, dist, eta, road);
  send(code, dist, eta, road);
}

/* ---------- UI ---------- */
$('dest').value = localStorage.getItem('dest') || '';
$('osrm').value = localStorage.getItem('osrm') || '';

$('btnBle').onclick = async () => {
  try { await bleConnect(); $('btnGo').disabled = false; }
  catch (e) { log('接続失敗: ' + e.message); }
};

$('btnTest').onclick = () => {
  hud(T.RIGHT, 180, 12, 'テスト通り');
  send(T.RIGHT, 180, 12, 'テスト通り');
};

$('btnGo').onclick = async () => {
  const q = $('dest').value.trim();
  if (!q) return log('目的地を入れてください');
  localStorage.setItem('dest', q);
  localStorage.setItem('osrm', $('osrm').value.trim());

  $('btnGo').disabled = true;
  try {
    const here = await new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(res, rej,
        { enableHighAccuracy:true, timeout:15000 }));
    const from = [here.coords.longitude, here.coords.latitude];
    dest = await geocode(q);
    await route(from, dest);

    try { wakeLock = await navigator.wakeLock.request('screen'); log('画面ロック抑止 ON'); }
    catch (e) { log('wakeLock 不可 → 設定で自動ロックをオフに'); }

    watchId = navigator.geolocation.watchPosition(onFix,
                e => log('GPS: ' + e.message),
                { enableHighAccuracy:true, maximumAge:1000, timeout:20000 });
    $('btnStop').disabled = false;
    log('ナビ開始');
  } catch (e) {
    log('エラー: ' + e.message);
    $('btnGo').disabled = false;
  }
};

$('btnStop').onclick = () => {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  steps = []; coords = [];
  send(255, 0, 0, '');
  $('btnStop').disabled = true;
  $('btnGo').disabled   = false;
  log('停止');
};
</script>
</html>
